security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Only one entry_point (the thing that decides how to respond to a
        # request that needs auth it doesn't have) can be configured per
        # firewall - form_login's is "redirect to the login page", which is
        # right for /admin but wrong for /api (an API client should see a
        # plain 401, not a redirect into an HTML login form). This firewall
        # has no authenticator of its own - context: admin shares session
        # storage with the main firewall below, so a browser that's already
        # logged in via /admin/login is recognized here too, and with no
        # form_login/entry_point configured on this firewall, Symfony's
        # default response to missing auth is a plain 401 rather than a
        # redirect. Must come before main below: firewalls are matched in
        # definition order, and this pattern is the more specific one.
        #
        # context: admin (shared with main below) ties both firewalls to
        # the same session-stored token instead of each defaulting to a key
        # derived from its own firewall name - deliberately named after
        # neither firewall so renaming either one later doesn't silently
        # change where the token is stored. One consequence worth knowing:
        # this key rename means any session that was already logged in
        # under the old (implicit, firewall-name-derived) key is logged out
        # the moment this deploys - fails closed, just re-log in once.
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            context: admin
            stateless: false
        main:
            lazy: true
            provider: app_user_provider
            context: admin
            login_throttling:
                max_attempts: 5
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_ADMIN, methods: [POST, PUT, PATCH, DELETE] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
