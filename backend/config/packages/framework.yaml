# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # In production this container's port is never published to the host -
    # infra/docker-compose.yml only exposes Caddy's 80/443, so the only thing
    # that can ever be the direct TCP peer of this app is Caddy itself,
    # reverse-proxying real HTTPS traffic over plain HTTP inside the Docker
    # network. Without trusting it, Symfony has no way to know the original
    # request was HTTPS (Request::isSecure() reads the *direct* connection,
    # which is always HTTP here) - breaking any absolute URL generation
    # (e.g. EasyAdmin's autocomplete endpoint URLs) by emitting http:// on an
    # https:// page, which browsers block as mixed content. REMOTE_ADDR
    # dynamically trusts whichever host actually connected, which is safe
    # specifically because nothing but Caddy can connect at all.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    #
    # cookie_samesite pinned explicitly (matches Symfony's own default -
    # this changes no actual behavior) because it's now load-bearing: the
    # api firewall (security.yaml) authenticates /api writes off this same
    # session cookie with no CSRF check of its own, since a JSON API can't
    # be driven by a cross-site HTML form anyway. samesite=lax is what
    # actually stops the cookie being sent on a cross-site fetch/XHR POST -
    # worth a reader seeing that decision made on purpose, not inheriting
    # it silently from a framework default that could change.
    session:
        cookie_samesite: lax

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
