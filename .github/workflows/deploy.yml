name: Deploy

on:
  push:
    branches: 
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/frosteato/0brien-frontend
  BACKEND_IMAGE: ghcr.io/frosteato/0brien-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files
        run: |
          scp -i ~/.ssh/deploy_key infra/docker-compose.yml infra/Caddyfile \
            "root@${{ secrets.DEPLOY_HOST }}:/opt/0brien/"

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.DEPLOY_HOST }}" '
            cd /opt/0brien &&
            docker compose pull &&
            docker compose up -d --remove-orphans &&
            docker compose restart caddy &&
            docker image prune -f
          '
