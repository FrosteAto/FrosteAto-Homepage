name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # No semver gating - patch, minor, or major, all auto-merge as soon as
      # the required "checks / frontend" and "checks / backend" status checks
      # pass. That branch protection rule is what actually gates this; this
      # step just approves and queues the merge.
      - name: Approve and enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
